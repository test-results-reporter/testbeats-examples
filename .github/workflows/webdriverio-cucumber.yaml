name: WebDriverIO Cucumber

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./webdriverio-cucumber

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm run test
    - name: Publish to TestBeats
      run: npx testbeats@latest publish -c testbeats.config.json
      if: always()
      env:
        TEST_BEATS_API_KEY: ${{ secrets.TEST_BEATS_API_KEY }}
        SLACK_MVP_URL: ${{ secrets.SLACK_MVP_URL }}
